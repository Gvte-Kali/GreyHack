const newId = () => globalThis.crypto?.randomUUID?.() ?? Date.now() + '-' + Math.random().toString(36).slice(2);
const newMission = () => ({id:newId(), values:{}, done:[]});

function isRecord(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function validateNotebook(value) {
  if (!isRecord(value) || value.version !== 1 || !Array.isArray(value.missions) || !value.missions.length) {
    throw new Error('Invalid notebook');
  }
  const ids = new Set();
  const missions = value.missions.map((mission) => {
    if (!isRecord(mission) || typeof mission.id !== 'string' || !mission.id || ids.has(mission.id) ||
        !isRecord(mission.values) || !Array.isArray(mission.done)) {
      throw new Error('Invalid mission');
    }
    ids.add(mission.id);
    const values = {};
    for (const [key] of fields) {
      if (typeof mission.values[key] === 'string') values[key] = mission.values[key];
    }
    const done = stepIds.filter((id) => mission.done.includes(id));
    return {id:mission.id, values, done};
  });
  return {
    version:1,
    lang:value.lang === 'en' ? 'en' : 'fr',
    active:ids.has(value.active) ? value.active : missions[0].id,
    missions
  };
}

function loadNotebook() {
  try {
    const saved = localStorage.getItem(storageKey);
    if (saved) return validateNotebook(JSON.parse(saved));
  } catch {}
  const mission = newMission();
  return {version:1, lang:'fr', active:mission.id, missions:[mission]};
}

const notebook = loadNotebook();
const local = (pair) => pair[notebook.lang === 'en' ? 1 : 0];
const t = (key) => local(ui[key]);
const currentMission = () => notebook.missions.find((mission) => mission.id === notebook.active);
const normalize = (value) => value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function make(tag, label = '', className = '') {
  const element = document.createElement(tag);
  if (label) element.textContent = label;
  if (className) element.className = className;
  return element;
}

function save(message = 'saved') {
  try {
    localStorage.setItem(storageKey, JSON.stringify(notebook));
    $('status').textContent = t(message);
  } catch {
    $('status').textContent = t('unsaved');
  }
}

function buildFields() {
  const mission = currentMission();
  const controls = fields.map(([key, name, rows]) => {
    const wrapper = make('label', '', rows ? 'field wide' : 'field');
    const control = make(rows ? 'textarea' : 'input');
    if (rows) control.rows = rows;
    else control.type = 'text';
    control.id = 'field-' + key;
    control.value = mission.values[key] ?? '';
    control.addEventListener('input', () => {
      mission.values[key] = control.value;
      if (key === 'title') $('mission-picker').selectedOptions[0].textContent = missionName(mission);
      save();
    });
    wrapper.append(make('span', local(name)), control);
    return wrapper;
  });
  $('fields').replaceChildren(...controls);
}

const missionName = (mission) => mission.values.title?.trim() || t('untitled');

function updateProgress() {
  const done = currentMission().done.length;
  $('progress').max = steps.length;
  $('progress').value = done;
  $('progress-value').textContent = done + ' / ' + steps.length;
}

function renderMission() {
  const picker = $('mission-picker');
  picker.replaceChildren(...notebook.missions.map((mission) => {
    const option = make('option', missionName(mission));
    option.value = mission.id;
    return option;
  }));
  picker.value = notebook.active;
  buildFields();
  const mission = currentMission();
  $('steps').replaceChildren(...steps.map(([id, title, detail]) => {
    const label = make('label', '', 'step');
    const input = make('input');
    input.type = 'checkbox';
    input.checked = mission.done.includes(id);
    input.addEventListener('change', () => {
      if (input.checked) mission.done.push(id);
      else mission.done = mission.done.filter((item) => item !== id);
      updateProgress();
      save();
    });
    const body = make('span');
    body.append(make('strong', local(title)), make('small', local(detail)));
    label.append(input, body);
    return label;
  }));
  updateProgress();
}

function link(text, url) {
  const anchor = make('a', text);
  anchor.href = url;
  return anchor;
}

async function copyCode(code, codeElement, status) {
  try {
    await navigator.clipboard.writeText(code);
    status.textContent = t('copied');
  } catch {
    const range = document.createRange();
    range.selectNodeContents(codeElement);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    status.textContent = t('copyHelp');
  }
}

function buildCard(card) {
  const article = make('article', '', 'card');
  article.dataset.search = normalize([...card.name, ...card.desc, ...ui[card.status], ...(card.checks?.flat() ?? []), ...(card.finding ?? []), card.code, card.codeEn].join(' '));
  article.append(make('span', t(card.status), 'tag ' + card.status), make('h3', local(card.name)), make('p', local(card.desc)));
  if (card.checks) {
    const next = make('div', '', 'service-details');
    const list = make('ol');
    list.append(...card.checks.map((step) => make('li', local(step))));
    const finding = make('p', local(card.finding));
    next.append(make('strong', t('next')), list, make('strong', t('finding')), finding);
    article.append(next);
  }
  const code = notebook.lang === 'en' ? card.codeEn ?? card.code : card.code;
  if (code) {
    const pre = make('pre');
    const content = make('code', code);
    const button = make('button', t('copy'), 'copy');
    button.type = 'button';
    const feedback = make('span', '', 'help');
    feedback.setAttribute('role','status');
    button.addEventListener('click', () => copyCode(code, content, feedback));
    pre.append(content);
    article.append(pre, button, document.createTextNode(' '), feedback);
  }
  if (card.src) {
    const footer = make('footer');
    const [name, url] = sources[card.src];
    footer.append(link(name, url));
    article.append(footer);
  }
  return article;
}

function renderLibrary() {
  for (const [id, cards] of [['setup-cards',setup],['command-cards',commands],['service-cards',services],['service-guides',serviceGuides],['network-cards',network]]) {
    $(id).replaceChildren(...cards.map(buildCard));
  }
  const nodes = [['Côté WAN','WAN side'],['Routeur du jeu','In-game router'],['Hôte LAN','LAN host']];
  $('topology').replaceChildren(...nodes.flatMap((name, index) => {
    const node = make('span', local(name), 'node');
    return index ? [make('span', '→', 'arrow'), node] : [node];
  }));
  $('topology').setAttribute('aria-label', nodes.map(local).join(' → '));
  $('diagnostic-cards').replaceChildren(...diagnostics.map(([name, detail]) => {
    const item = make('details');
    item.dataset.search = normalize([...name, ...detail].join(' '));
    item.append(make('summary', local(name)), make('p', local(detail)));
    return item;
  }));
  $('legend').replaceChildren(...['verified','pending','reference'].map((status) => make('span',t(status),'tag ' + status)));
  $('source-list').replaceChildren(...Object.values(sources).map(([name, url, detail]) => {
    const item = make('li');
    item.dataset.search = normalize([name, ...detail].join(' '));
    item.append(link(name,url), document.createTextNode(' · ' + local(detail)));
    return item;
  }));
}

function filterLibrary() {
  const terms = normalize($('search').value.trim()).split(/\s+/).filter(Boolean);
  let count = 0;
  for (const section of document.querySelectorAll('.library')) {
    let visible = 0;
    const heading = section.querySelector('.heading').textContent;
    const headingIndex = normalize(heading + ' ' + ui[section.id].join(' '));
    for (const item of section.querySelectorAll('[data-search]')) {
      item.hidden = terms.some((term) => !item.dataset.search.includes(term) && !headingIndex.includes(term));
      if (!item.hidden) visible++;
    }
    section.hidden = !visible;
    count += visible;
    $('nav').querySelector('[href="#' + section.id + '"]').hidden = !visible;
  }
  $('matches').hidden = !terms.length;
  $('matches').textContent = count ? count + ' ' + t(count === 1 ? 'result' : 'results') : t('empty');
}

function renderLanguage() {
  document.documentElement.lang = notebook.lang;
  document.title = t('title');
  const language = $('language');
  language.lang = notebook.lang === 'fr' ? 'en' : 'fr';
  language.textContent = notebook.lang === 'fr' ? 'English (EN)' : 'Français (FR)';
  document.querySelectorAll('[data-i]').forEach((element) => {element.textContent = t(element.dataset.i);});
  document.querySelectorAll('[data-ph]').forEach((element) => {element.placeholder = t(element.dataset.ph);});
  document.querySelectorAll('[data-aria]').forEach((element) => {element.setAttribute('aria-label', t(element.dataset.aria));});
  $('nav').replaceChildren(...navigation.map((id) => link(t(id), '#' + id)));
  renderMission();
  renderLibrary();
  filterLibrary();
}

$('language').addEventListener('click', () => {
  notebook.lang = notebook.lang === 'fr' ? 'en' : 'fr';
  renderLanguage();
  save();
});
$('search').addEventListener('input', filterLibrary);
$('mission-picker').addEventListener('change', (event) => {
  notebook.active = event.target.value;
  renderMission();
  save();
});
$('add').addEventListener('click', () => {
  const mission = newMission();
  notebook.missions.push(mission);
  notebook.active = mission.id;
  renderMission();
  save();
  $('field-title').focus();
});
$('remove').addEventListener('click', () => {
  if (!window.confirm(t('confirm'))) return;
  const index = notebook.missions.findIndex((mission) => mission.id === notebook.active);
  notebook.missions.splice(index, 1);
  if (!notebook.missions.length) notebook.missions.push(newMission());
  notebook.active = notebook.missions[Math.min(index, notebook.missions.length - 1)].id;
  renderMission();
  save();
  $('mission-picker').focus();
});
$('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(notebook, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const download = link('', url);
  download.download = 'grey-hack-missions.json';
  document.body.append(download);
  download.click();
  download.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
$('import').addEventListener('click', () => $('import-file').click());
$('import-file').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const incoming = validateNotebook(JSON.parse(await file.text()));
    const copies = incoming.missions.map((mission) => ({...mission,id:newId()}));
    const initial = notebook.missions[0];
    if (notebook.missions.length === 1 && !initial.done.length && !Object.values(initial.values).some(Boolean)) {
      notebook.missions = [];
    }
    notebook.missions.push(...copies);
    notebook.active = copies[incoming.missions.findIndex((mission) => mission.id === incoming.active)].id;
    renderMission();
    save('imported');
  } catch {
    $('status').textContent = t('importError');
  } finally {
    event.target.value = '';
  }
});

renderLanguage();
save();
</script>
</body>
</html>
